<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Лендинг клуба единоборств</title>
<desc id="d">Промо-обложка проекта Force Team в красно-синей спортивной стилистике</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#17070a"/><stop offset=".46" stop-color="#07121f"/><stop offset="1" stop-color="#071c33"/></linearGradient>
  <radialGradient id="red"><stop stop-color="#ff2338" stop-opacity=".75"/><stop offset="1" stop-color="#ff2338" stop-opacity="0"/></radialGradient>
  <radialGradient id="blue"><stop stop-color="#2e8cff" stop-opacity=".7"/><stop offset="1" stop-color="#2e8cff" stop-opacity="0"/></radialGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111d"/><stop offset="1" stop-color="#101923"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="140" cy="190" r="290" fill="url(#red)" filter="url(#glow)"/>
<circle cx="1410" cy="180" r="330" fill="url(#blue)" filter="url(#glow)"/>
<g opacity=".14" fill="#fff">
  <circle cx="80" cy="90" r="14"/><circle cx="1500" cy="90" r="16"/><circle cx="1450" cy="150" r="10"/>
</g>

<text x="110" y="145" fill="#f4f4f4" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="900" letter-spacing="2">ЛЕНДИНГ</text>
<text x="110" y="245" fill="#ff2233" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="900">КЛУБА ЕДИНОБОРСТВ</text>
<text x="115" y="300" fill="#e7ebef" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="10">ДИЗАЙН  •  АДАПТИВ  •  РАЗРАБОТКА</text>

<!-- laptop -->
<g transform="translate(110 365)">
  <rect x="0" y="0" width="770" height="390" rx="24" fill="#090d12" stroke="#708090" stroke-width="5"/>
  <rect x="22" y="20" width="726" height="340" rx="12" fill="url(#screen)"/>
  <text x="54" y="68" fill="#fff" font-family="Arial" font-size="24" font-weight="800">FORCE TEAM</text>
  <text x="54" y="115" fill="#a8b3bf" font-family="Arial" font-size="15" letter-spacing="4">ЕДИНОБОРСТВА — ВЫБОР СИЛЬНЫХ</text>
  <text x="54" y="175" fill="#fff" font-family="Arial" font-size="46" font-weight="900">СИЛА</text>
  <text x="54" y="225" fill="#fff" font-family="Arial" font-size="46" font-weight="900">ДИСЦИПЛИНА</text>
  <text x="54" y="275" fill="#ff2233" font-family="Arial" font-size="46" font-weight="900">ПОБЕДА</text>
  <rect x="54" y="300" width="220" height="40" rx="7" fill="#ef2635"/>
  <text x="75" y="327" fill="#fff" font-family="Arial" font-size="14" font-weight="700">ЗАПИСАТЬСЯ НА ТРЕНИРОВКУ</text>
  <g transform="translate(395 78)">
    <rect width="315" height="220" rx="16" fill="#101c29"/>
    <circle cx="108" cy="115" r="72" fill="#163b6a"/>
    <circle cx="205" cy="112" r="72" fill="#671c2a"/>
    <path d="M95 90l55 44-18 27-64-44z" fill="#2d74c9"/>
    <path d="M220 84l-54 52 20 29 62-52z" fill="#d6313d"/>
    <circle cx="103" cy="73" r="23" fill="#d7dce0"/>
    <circle cx="220" cy="70" r="23" fill="#d7dce0"/>
  </g>
  <rect x="65" y="382" width="640" height="14" rx="7" fill="#4d545c"/>
  <rect x="260" y="396" width="250" height="14" rx="7" fill="#23292f"/>
</g>

<!-- phone -->
<g transform="translate(800 490)">
  <rect width="195" height="345" rx="34" fill="#05070a" stroke="#6b737d" stroke-width="4"/>
  <rect x="12" y="18" width="171" height="306" rx="23" fill="#0b1420"/>
  <text x="30" y="65" fill="#fff" font-family="Arial" font-size="15" font-weight="800">FORCE TEAM</text>
  <text x="30" y="125" fill="#fff" font-family="Arial" font-size="26" font-weight="900">СИЛА</text>
  <text x="30" y="158" fill="#fff" font-family="Arial" font-size="26" font-weight="900">ДИСЦИПЛИНА</text>
  <text x="30" y="191" fill="#ff2233" font-family="Arial" font-size="26" font-weight="900">ПОБЕДА</text>
  <rect x="30" y="218" width="112" height="34" rx="6" fill="#ef2635"/>
  <text x="47" y="240" fill="#fff" font-family="Arial" font-size="12" font-weight="700">ЗАПИСАТЬСЯ</text>
  <text x="30" y="292" fill="#9aa8b7" font-family="Arial" font-size="11">ТРЕНИРОВКИ • РАСПИСАНИЕ</text>
</g>

<!-- stylized fighter -->
<g transform="translate(1110 330)">
  <ellipse cx="215" cy="480" rx="250" ry="45" fill="#000" opacity=".45"/>
  <circle cx="212" cy="75" r="70" fill="#cda287"/>
  <path d="M150 135 Q215 105 285 140 L330 355 Q270 430 150 395 L105 210Z" fill="#0f4a87"/>
  <path d="M156 153 L110 255 66 235 125 130Z" fill="#155da6"/>
  <path d="M276 150 L345 250 386 216 315 120Z" fill="#155da6"/>
