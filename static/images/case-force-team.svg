  <circle cx="392" cy="215" r="40" fill="#103968" stroke="#5ea2e8" stroke-width="7"/>
  <path d="M150 135 Q215 185 285 140" fill="none" stroke="#7cb4e7" stroke-width="9"/>
  <rect x="140" y="370" width="190" height="20" rx="10" fill="#0a1d31"/>
  <path d="M170 48 Q205 8 250 50" fill="none" stroke="#20150f" stroke-width="24" stroke-linecap="round"/>
</g>

<text x="1080" y="120" fill="#7d8b9b" font-family="Arial" font-size="22" font-weight="800">СИЛА</text>
<text x="1080" y="152" fill="#7d8b9b" font-family="Arial" font-size="22" font-weight="800">ХАРАКТЕР</text>
<text x="1080" y="184" fill="#7d8b9b" font-family="Arial" font-size="22" font-weight="800">ДИСЦИПЛИНА</text>
<text x="1080" y="216" fill="#7d8b9b" font-family="Arial" font-size="22" font-weight="800">ПОБЕДА</text>
<rect x="1080" y="235" width="70" height="6" fill="#ff2233"/>

<text x="1500" y="350" transform="rotate(-90 1500 350)" fill="#788595" opacity=".45" font-family="Arial" font-size="30" font-weight="800">ЕДИНОБОРСТВА • БОЛЬШЕ ЧЕМ СПОРТ</text>
</svg>