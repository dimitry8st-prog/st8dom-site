<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GPT-6 и Claude Opus 5.5 — Кот-рыцарь KnightCat</title>
  <desc id="desc">Обложка статьи о новых AI-моделях с маскотом KnightCat в рыцарских доспехах</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06152f"/>
      <stop offset="0.62" stop-color="#0b2852"/>
      <stop offset="1" stop-color="#08172f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#19d3ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#19d3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8eeff"/>
      <stop offset=".5" stop-color="#3da9df"/>
      <stop offset="1" stop-color="#14568c"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#e96100"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="940" cy="310" r="300" fill="url(#halo)"/>
  <g opacity=".28" stroke="#46bfff" fill="none">
    <path d="M0 520 C220 430 340 610 560 520 S900 430 1200 525"/>
    <path d="M0 548 C210 465 355 625 590 538 S910 455 1200 555"/>
    <path d="M72 104 H505 M72 126 H410" stroke-dasharray="4 10"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="70" y="66" width="254" height="44" rx="22" fill="#ff9418"/>
    <text x="197" y="96" text-anchor="middle" font-size="21" font-weight="800" fill="#06152f" letter-spacing="1.5">НОВЫЕ AI-МОДЕЛИ</text>
    <text x="70" y="205" font-size="78" font-weight="900" fill="#ffffff">GPT-6</text>
    <text x="70" y="284" font-size="55" font-weight="800" fill="#79dcff">CLAUDE OPUS 5.5</text>
    <rect x="70" y="310" width="575" height="5" rx="2.5" fill="#ff9418"/>
    <text x="70" y="365" font-size="27" font-weight="600" fill="#e9f5ff">От собеседника — к цифровому исполнителю</text>
    <text x="70" y="420" font-size="22" fill="#b8cee4">Агенты · инструменты · цена задачи · безопасность</text>
    <g transform="translate(70 476)">
      <rect width="180" height="54" rx="14" fill="#102f59" stroke="#2b77bd"/>
      <text x="90" y="35" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">OPENAI</text>
      <rect x="196" width="210" height="54" rx="14" fill="#102f59" stroke="#ff9418"/>
      <text x="301" y="35" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">ANTHROPIC</text>
    </g>
    <text x="70" y="587" font-size="19" font-weight="700" fill="#ffb34c">st8dom.ru · Степанов Д.А.</text>
  </g>

  <!-- KnightCat: the portal mascot as a vigilant armored cat -->
  <g transform="translate(745 78)">
    <ellipse cx="225" cy="448" rx="190" ry="32" fill="#020b17" opacity=".62"/>
    <circle cx="225" cy="214" r="172" fill="none" stroke="#32cfff" stroke-width="3" opacity=".55"/>
    <circle cx="225" cy="214" r="142" fill="none" stroke="#ff9418" stroke-width="2" stroke-dasharray="8 13" opacity=".72"/>
    <circle cx="225" cy="214" r="102" fill="none" stroke="#4fc5ff" stroke-width="2" stroke-dasharray="3 12" opacity=".7"/>
    <circle cx="53" cy="177" r="9" fill="#ff9a1f" filter="url(#glow)"/>
    <circle cx="382" cy="146" r="8" fill="#46d9ff" filter="url(#glow)"/>
    <circle cx="347" cy="333" r="7" fill="#ff9a1f" filter="url(#glow)"/>

    <path d="M151 130 L169 55 L216 118 Z" fill="#f48216" stroke="#ffc16a" stroke-width="5"/>
    <path d="M294 130 L278 55 L232 118 Z" fill="#f48216" stroke="#ffc16a" stroke-width="5"/>
    <path d="M132 165 Q138 102 225 94 Q312 102 318 165 L300 250 Q280 304 225 315 Q170 304 150 250 Z" fill="#f18a1b" stroke="#ffc56d" stroke-width="6"/>
    <path d="M143 171 Q225 89 307 171 L292 135 Q225 88 158 135 Z" fill="url(#armor)" stroke="#d4f4ff" stroke-width="5"/>
    <path d="M151 170 Q225 119 299 170 L285 197 Q225 168 165 197 Z" fill="#153c6d"/>
    <path d="M225 100 V176" stroke="#ff9b20" stroke-width="8"/>
    <path d="M198 193 Q180 177 165 198 Q184 218 205 203" fill="#08172f"/>
    <path d="M252 193 Q270 177 285 198 Q266 218 245 203" fill="#08172f"/>
    <circle cx="186" cy="197" r="6" fill="#55eeff" filter="url(#glow)"/>
    <circle cx="264" cy="197" r="6" fill="#55eeff" filter="url(#glow)"/>
    <path d="M211 225 Q225 215 239 225 L225 238 Z" fill="#3a190a"/>
    <path d="M225 238 Q202 252 187 241 M225 238 Q248 252 263 241" fill="none" stroke="#fff0db" stroke-width="5" stroke-linecap="round"/>
    <path d="M162 270 Q225 320 288 270 L316 407 Q225 458 134 407 Z" fill="url(#armor)" stroke="#d2f3ff" stroke-width="6"/>
    <path d="M190 293 L225 321 L260 293 L273 398 L225 427 L177 398 Z" fill="#0a2b54" stroke="#38c4f1" stroke-width="4"/>
    <path d="M225 321 L225 423" stroke="#ff9418" stroke-width="7"/>

    <g transform="translate(283 270)">
      <path d="M0 30 Q58 0 116 30 V112 Q72 160 58 166 Q44 160 0 112 Z" fill="url(#shield)" stroke="#ffe0a6" stroke-width="6"/>
      <path d="M58 31 V139 M18 77 H98" stroke="#082449" stroke-width="12" stroke-linecap="round"/>
      <text x="58" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">KC</text>
    </g>
    <g transform="translate(112 279) rotate(-16)">
      <rect x="0" y="0" width="13" height="151" rx="6" fill="#d8f3ff"/>
      <path d="M6 -42 L24 0 L-12 0 Z" fill="#73dcff" stroke="#e6f9ff" stroke-width="3"/>
      <rect x="-20" y="135" width="53" height="12" rx="6" fill="#ff9a1f"/>
    </g>
  </g>
</svg>
