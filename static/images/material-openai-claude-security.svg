      <stop offset="0" stop-color="#07142f"/>
      <stop offset="1" stop-color="#122b66"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="32%" r="54%">
      <stop offset="0" stop-color="#f28c28" stop-opacity=".34"/>
      <stop offset="1" stop-color="#f28c28" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="34" fill="url(#glow)"/>
  <g fill="none" stroke="#f28c28" stroke-width="4" opacity=".85">
