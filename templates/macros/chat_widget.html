<div
  id="site-chat"
  class="site-chat"
  data-chat-url="{{ url_for('chat') }}"
  data-contact-url="{{ url_for('contact') }}"
  data-telegram-url="{{ telegram_url }}"
  data-csrf="{{ csrf_token() }}"
>
  <button
    type="button"
    class="chat-launcher"
    id="chat-launcher"
    aria-expanded="false"
    aria-controls="chat-widget"
    aria-label="Открыть ассистента сайта"
  >
    <img class="chat-launcher-mascot" src="{{ url_for('static', filename='images/dis-mascot-orange.jpg') }}" alt="">
  </button>

  <section
    class="chat-widget"
    id="chat-widget"
    hidden
    role="dialog"
    aria-labelledby="chat-title"
    aria-modal="false"
  >
    <header class="chat-header">
      <div class="chat-header-left">
        <span class="chat-avatar" aria-hidden="true"><img src="{{ url_for('static', filename='images/dis-mascot-orange.jpg') }}" alt=""></span>
        <div>
          <p class="chat-title" id="chat-title">Дис — цифровой помощник</p>
          <p class="chat-subtitle">Быстро найду нужный маршрут</p>
        </div>
      </div>
      <button type="button" class="chat-close" id="chat-close" aria-label="Закрыть чат">×</button>
    </header>
    <div class="chat-messages" id="chat-messages" role="log" aria-live="polite"></div>
    <form class="chat-footer" id="chat-form">
      <label class="visually-hidden" for="chat-input">Вопрос ассистенту</label>
      <input
        class="chat-input"
        id="chat-input"
        name="message"
        type="text"
        maxlength="400"
        autocomplete="off"
        placeholder="Спросите про услуги, сроки, кейсы"
      >
      <button class="chat-send" id="chat-send" type="submit">Отправить</button>
    </form>
  </section>
</div>
