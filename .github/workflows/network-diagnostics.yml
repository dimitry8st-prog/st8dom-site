name: portal-network-diagnostics

on:
  push:
    branches:
      - diagnostics/portal-network-2026-10-29

permissions: {}

jobs:
  external-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only DNS, TCP and verified HTTPS checks
        shell: bash
        run: |
          python3 -u - <<'PY'
          import concurrent.futures
          import datetime
          import signal
          import socket
          import ssl
          import time

          HOST = "st8dom.ru"
          IPV4 = "72.56.76.107"

          print("SOURCE: GitHub-hosted runner; this is not the user's Wi-Fi")
          print("UTC:", datetime.datetime.now(datetime.timezone.utc).isoformat())

          def alarm_handler(signum, frame):
              raise TimeoutError("DNS query exceeded 8 seconds")

          signal.signal(signal.SIGALRM, alarm_handler)
          for family, label in ((socket.AF_INET, "A"), (socket.AF_INET6, "AAAA")):
              try:
                  signal.alarm(8)
                  addresses = sorted({item[4][0] for item in socket.getaddrinfo(
                      HOST, 443, family, socket.SOCK_STREAM)})
                  print("DNS", label, HOST, addresses)
                  if family == socket.AF_INET:
                      print("DNS_A_CONTAINS_EXPECTED_IP:", IPV4 in addresses)
              except Exception as exc:
                  print("DNS", label, type(exc).__name__, str(exc))
              finally:
                  signal.alarm(0)

          def check_tcp(port):
              started = time.monotonic()
              try:
                  with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as connection:
                      connection.settimeout(5)
                      connection.connect((IPV4, port))
                  return f"TCP {IPV4}:{port} OPEN {time.monotonic() - started:.2f}s"
              except OSError as exc:
                  return (f"TCP {IPV4}:{port} FAILED {type(exc).__name__} "
                          f"errno={exc.errno} {time.monotonic() - started:.2f}s")

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              for result in executor.map(check_tcp, (22, 80, 443, 88)):
                  print(result)

          try:
              context = ssl.create_default_context()
              with socket.create_connection((IPV4, 443), timeout=6) as connection:
                  with context.wrap_socket(connection, server_hostname=HOST) as secure:
                      print("TLS:", secure.version(), "certificate verified for", HOST)
                      secure.sendall((f"HEAD / HTTP/1.1\r\nHost: {HOST}\r\n"
                                      "User-Agent: PortalNetworkDiagnostic/1.0\r\n"
                                      "Connection: close\r\n\r\n").encode("ascii"))
                      response = secure.recv(256)
                      print("HTTP_STATUS_LINE:", response.split(b"\r\n", 1)[0][:120].decode(
                          "ascii", errors="replace"))
          except (OSError, ssl.SSLError) as exc:
              print("HTTPS_FAILED:", type(exc).__name__, str(exc))

          print("CHECKS_COMPLETE: inspect individual results; completion is not a health verdict")
          PY
      - name: Verify published DNA-SaM article without authentication
        shell: bash
        run: |
          python3 -u - <<'PY'
          import html
          import http.client
          import ssl
          from html.parser import HTMLParser

          HOST = "st8dom.ru"
          PATH = "/materials/hranenie-tsifrovyh-dannyh-dnk-bakteriy-dna-sam/"
          TITLE = "Хранение цифровых данных в ДНК бактерий с помощью системы DNA-SaM"

          def public_get(path):
              connection = http.client.HTTPSConnection(
                  HOST, timeout=10, context=ssl.create_default_context())
              try:
                  connection.request("GET", path, headers={
                      "User-Agent": "PortalPublicationVerificationBot/1.0",
                      "Accept": "text/html,application/xml",
                      "Cache-Control": "no-cache",
                  })
                  response = connection.getresponse()
                  body = response.read(2_000_001)
                  print("PUBLIC_GET", path, "HTTP", response.status, "BYTES", len(body))
                  assert response.status == 200, "Expected public HTTP 200"
                  assert len(body) <= 2_000_000, "Response exceeds verification limit"
                  return body.decode("utf-8")
              finally:
                  connection.close()

          class HeadingParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_h1 = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "h1":
                      self.in_h1 = True
              def handle_endtag(self, tag):
                  if tag == "h1":
                      self.in_h1 = False
              def handle_data(self, data):
                  if self.in_h1:
                      self.parts.append(data)

          article = public_get(PATH)
          parser = HeadingParser()
          parser.feed(article)
          heading = " ".join("".join(parser.parts).split())
          print("ARTICLE_H1:", heading)
          assert heading == TITLE, "Published title differs from approved title"
          for marker in (
              "s41467-026-78759-4",
              "41467_2026_78759_MOESM1_ESM.pdf",
              "nature23017",
              "PMC7904632",
          ):
              present = marker in html.unescape(article)
              print("PRIMARY_SOURCE_PRESENT", marker, present)
              assert present, "Approved primary source link missing"
          for path, label in (("/sitemap.xml", "SITEMAP"), ("/", "HOMEPAGE")):
              present = PATH in html.unescape(public_get(path))
              print(label + "_CONTAINS_ARTICLE:", present)
              assert present, "Published article missing from " + label
          print("ARTICLE_PUBLICATION_VERIFIED: public page, title, four sources, sitemap, homepage")
          PY
      - name: Verify public KnightCat HTTPS ingress on port 88
        shell: bash
        run: |
          python3 -u - <<'PY'
          import http.client
          import ssl

          host = "st8dom.ru"
          for path, expected in (("/healthz", 200), ("/", 404)):
              connection = http.client.HTTPSConnection(
                  host, 88, timeout=8, context=ssl.create_default_context())
              try:
                  connection.connect()
                  print("KNIGHTCAT_TLS:", connection.sock.version(),
                        "certificate verified for", host)
                  connection.request("GET", path, headers={
                      "User-Agent": "KnightCatIngressDiagnostic/1.0",
                      "Connection": "close",
                  })
                  response = connection.getresponse()
                  body = response.read(513)
                  print("KNIGHTCAT_PUBLIC_GET", host + ":88" + path,
                        "HTTP", response.status)
                  assert response.status == expected, "Unexpected ingress HTTP status"
                  assert len(body) <= 512, "Unexpected ingress response size"
                  if path == "/healthz":
                      assert body == b"knightcat ingress ready", "Unexpected health response"
              finally:
                  connection.close()
          print("KNIGHTCAT_INGRESS_VERIFIED: trusted TLS, health 200, root 404")
          PY
