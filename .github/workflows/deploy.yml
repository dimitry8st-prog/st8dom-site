# .github/workflows/deploy.yml — единственный файл, который надо добавить в репозиторий.
# Код приложения не трогается.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /srv/st8dom

            PREV=$(grep '^APP_TAG=' .env | tail -1 | cut -d= -f2 || true)
            [ -z "$PREV" ] && PREV=latest
            set_tag() { sed -i '/^APP_TAG=/d' .env; echo "APP_TAG=$1" >> .env; }

            set_tag "${{ github.sha }}"
            docker compose pull app

            # Схема и админ создаются при импорте приложения. Делаем это одним
            # процессом до старта, чтобы два воркера gunicorn не гонялись за этим.
            docker compose run --rm app python -c "import app"

            docker compose up -d --no-deps app

            for i in $(seq 1 20); do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo starting)
              if [ "$st" = "healthy" ]; then
                docker image prune -f
                exit 0
              fi
              sleep 3
            done

            echo "Контейнер не стал healthy за минуту, откат на $PREV"
            docker compose logs --tail=80 app
            set_tag "$PREV"
            docker compose up -d --no-deps app
            exit 1

  notify:
    needs: [test, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Деплой st8dom упал. Лог: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"