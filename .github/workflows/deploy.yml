# .github/workflows/deploy.yml — единственный файл, который надо добавить в репозиторий.
# Код приложения не трогается.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /srv/st8dom

            # Берём версию из работающего контейнера: .env мог измениться
            # во время неудачной загрузки образа в предыдущем запуске.
            PREV=$(docker inspect -f '{{.Config.Image}}' "$(docker compose ps -q app)" 2>/dev/null || true)
            PREV=${PREV##*:}
            [ -z "$PREV" ] && PREV=$(grep '^APP_TAG=' .env | tail -1 | cut -d= -f2 || true)
            [ -z "$PREV" ] && PREV=latest
            set_tag() { sed -i '/^APP_TAG=/d' .env; echo "APP_TAG=$1" >> .env; }

            # На VPS хранились старые, уже не используемые образы.
            # Docker сохраняет образ каждого запущенного контейнера и все тома.
            docker image prune -a -f
            set_tag "${{ github.sha }}"
            if ! docker compose pull app; then
              set_tag "$PREV"
              exit 1
            fi

            # Схема и админ создаются при импорте приложения. Делаем это одним
            # процессом до старта, чтобы два воркера gunicorn не гонялись за этим.
            docker compose run --rm app python -c "import app"

            docker compose up -d --no-deps app

            for i in $(seq 1 20); do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo starting)
              if [ "$st" = "healthy" ]; then
                # Deployment is not complete until the newest approved article
                # is present in the persistent DB and its public route serves 200.
                if ! docker compose exec -T app python -c 'from app import app; from models import Article; slugs=["anthropic-ipo-pervye-torgi-pochemu-chetverg-2026","anthropic-prizrak-yuzhnyh-morey-1720-ai-2026"]; ctx=app.app_context(); ctx.push(); checks=[(s,Article.query.filter_by(slug=s).first(),app.test_client().get("/materials/"+s+"/").status_code) for s in slugs]; print("ARTICLE_PUBLICATION_CHECK:",[(s,bool(a and a.is_public),code) for s,a,code in checks]); raise SystemExit(0 if all(a and a.is_public and code==200 for s,a,code in checks) else 1)'; then
                  echo "Новая публикация отсутствует в БД или маршрут возвращает не 200 — откат на $PREV"
                  docker compose logs --tail=60 app
                  set_tag "$PREV"
                  docker compose up -d --no-deps app
                  exit 1
                fi
                # Keep the Life-OS boundary inventory on the VPS only. Portal
                # articles are excluded from Vitalis; the command prints counts,
                # never article bodies or database credentials.
                private_dir=/srv/st8dom/private
                container_export=/tmp/lifeos-vitalis.json
                mkdir -p -m 700 "$private_dir"
                docker compose exec -T app python -m scripts.export_vitalis_lifeos \
                  --output "$container_export"
                app_id=$(docker compose ps -q app)
                [ -n "$app_id" ]
                host_export=$(mktemp "$private_dir/.lifeos-vitalis.XXXXXX")
                trap 'rm -f "$host_export"' EXIT
                docker cp "$app_id:$container_export" "$host_export"
                chmod 600 "$host_export"
                mv -f "$host_export" "$private_dir/lifeos-vitalis.json"
                docker compose exec -T app rm -f "$container_export"
                trap - EXIT
                docker image prune -f
                exit 0
              fi
              sleep 3
            done

            echo "Контейнер не стал healthy за минуту, откат на $PREV"
            docker compose logs --tail=80 app
            set_tag "$PREV"
            docker compose up -d --no-deps app
            exit 1

  verify-publication:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify both Anthropic articles are live
        shell: bash
        run: |
          set -e
          for slug in anthropic-ipo-pervye-torgi-pochemu-chetverg-2026 anthropic-prizrak-yuzhnyh-morey-1720-ai-2026; do
            url="https://st8dom.ru/materials/${slug}/"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              status=$(curl --location --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$url" || true)
              echo "$slug check ${attempt}/6: HTTP ${status}"
              if [ "$status" = "200" ]; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "Publication $slug not publicly accessible"
              exit 1
            fi
          done
          echo "PUBLIC_ARTICLES_HTTP_200"

  notify:
    needs: [test, build, deploy, verify-publication]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Деплой st8dom упал. Лог: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
