name: Vitalis cabinet maintenance
on:
  push:
    branches: [codex/vitalis-cabinet-ops-20261123]
    paths: [".github/workflows/vitalis-cabinet-maintenance.yml"]
permissions: {}
concurrency:
  group: vitalis-cabinet-maintenance
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the exact checkout and Node image for the cabinet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 25s
          command_timeout: 2m
          script: |
            set -eu
            cd /opt/vitalis-ru
            repo_git() { git -c safe.directory=/opt/vitalis-ru -c core.hooksPath=/dev/null "$@"; }
            head=$(repo_git rev-parse --verify HEAD)
            branch=$(repo_git symbolic-ref --quiet --short HEAD || printf 'detached')
            changes=$(repo_git status --porcelain --untracked-files=no)
            printf 'VITALIS_CHECKOUT=%s\nVITALIS_BRANCH=%s\n' "$head" "$branch"
            if [ -z "$changes" ]; then echo VITALIS_CHECKOUT_CLEAN=yes; else echo VITALIS_CHECKOUT_CLEAN=no; fi
            owner=$(stat -c '%u' .git)
            if [ "$owner" = "$(id -u)" ]; then
              echo VITALIS_CHECKOUT_ACCESS=owner
            elif sudo -n -u "#$owner" -- test -w /opt/vitalis-ru/.git 2>/dev/null; then
              echo VITALIS_CHECKOUT_ACCESS=owner_sudo
            elif [ -w .git ] && [ -w web ]; then
              echo VITALIS_CHECKOUT_ACCESS=shared
            else
              echo VITALIS_CHECKOUT_ACCESS=read_only
            fi
            node_id=$(docker compose ps -q node)
            test -n "$node_id"
            printf 'VITALIS_NODE_IMAGE_REF=%s\n' "$(docker inspect -f '{{.Config.Image}}' "$node_id")"
            printf 'VITALIS_COMPOSE_NODE_IMAGE=%s\n' "$(docker compose config --images node)"
            printf 'VITALIS_APP_SHA256=%s\n' "$(docker exec "$node_id" sha256sum /app/web/app.html | cut -d ' ' -f 1)"
