name: Синхронизация клинических рекомендаций

on:
  push:
    branches: [main]
    paths: [".github/workflows/sync-clinical-guidelines.yml"]
  schedule:
    # 06:30 по Москве (UTC+3), каждый понедельник.
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Проверить все страницы реестра"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: clinical-guidelines-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить тесты
        run: python -m pytest -q

      - name: Обновить российские и международные рекомендации
        id: collect
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        run: |
          # Минздрав отвечает с VPS, но соединения с GitHub runners истекают.
          # Ключ остаётся во временном файле, сетевой сбор не меняет БД портала.
          umask 077
          key_file="$RUNNER_TEMP/medical-sync-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          remote_args="--pages 5"
          if [[ "${{ inputs.full_sync }}" == "true" ]]; then
            remote_args="--full"
          fi
          ssh -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/medical-known-hosts" \
            "$SSH_USER@$SSH_HOST" \
            "cd /srv/st8dom && docker compose exec -T app python - $remote_args" \
            < scripts/export_remote_clinical_guidelines.py > "$RUNNER_TEMP/medical-snapshot.json"
          python scripts/sync_clinical_guidelines_vault.py \
            --snapshot "$RUNNER_TEMP/medical-snapshot.json" \
            --report-file "$RUNNER_TEMP/clinical-guidelines-report.json"

      - name: Отчёт по каждому источнику
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "clinical-guidelines-report.json"
          if not report.exists():
              raise SystemExit("Сбор не сформировал отчёт; проверьте журнал ошибки.")
          data = json.loads(report.read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Медицинские источники\n\n| Источник | Результат |\n| --- | --- |\n")
              for source, result in data["sources"].items():
                  status = "Проверен" if result["ok"] else "Ошибка: " + result["error"]
                  summary.write(f"| {source} | {status} |\n")
              summary.write(f"\nКарточек в сохранённом реестре: {data['stored']}.\n")
              if data["errors"]:
                  summary.write("\nСохранены результаты доступных источников; прежние карточки сохранены.\n")
          PY

      - name: Сохранить изменения
        id: persist
        shell: bash
        run: |
          if git diff --quiet -- data/clinical_guidelines.json obsidian-vault/; then
            echo "Официальный реестр не изменился"
            exit 0
          fi
          git config user.name "DIS Clinical Guidelines Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/clinical_guidelines.json obsidian-vault/
          git commit -m "Обновить клинические рекомендации"

          # Пока workflow работал, main мог измениться другим коммитом.
          # Подтягиваем свежий main перед push, чтобы не падать на non-fast-forward.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Конфликт при обновлении main — повторная синхронизация будет выполнена позже"
              exit 1
            fi
            echo "Push не прошёл, попытка $attempt из 3"
            sleep $((attempt * 3))
          done
          echo "Не удалось отправить обновление после 3 попыток"
          exit 1

      - name: Обновить портал после сохранения реестра
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Сообщить о неполном сборе
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Не все медицинские источники проверены. Подробности — в отчёте по источникам."
          exit 1
