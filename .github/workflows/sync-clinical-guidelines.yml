name: Синхронизация клинических рекомендаций

on:
  schedule:
    # 06:30 по Москве (UTC+3), каждый понедельник.
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Проверить все страницы реестра"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: clinical-guidelines-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Обновить российские и международные рекомендации
        shell: bash
        run: |
          if [[ "${{ inputs.full_sync }}" == "true" ]]; then
            python scripts/sync_clinical_guidelines_vault.py --full
          else
            python scripts/sync_clinical_guidelines_vault.py --pages 5
          fi

      - name: Проверить тесты
        run: python -m pytest -q

      # В main этот job не пушит: push от GITHUB_TOKEN не запустил бы deploy.
      # Открытый pull request после объединения даёт обычный push в main.
      - name: Открыть или обновить pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/open_clinical_guidelines_pr.py
