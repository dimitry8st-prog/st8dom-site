name: Import AutoSfera media

on:
  push:
    branches:
      - codex/autosfera-mascot-video

permissions:
  contents: write

jobs:
  import-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/autosfera-mascot-video
      - name: Download verified media
        run: |
          set -euo pipefail
          mkdir -p static/images static/video
          curl --fail --location --retry 3             --output static/images/case-autosfera-ai.png             "https://raw.githubusercontent.com/dimitry8st-prog/AutoSfera-AI-/demo/course-video-package/demo/video-defense/assets/dis-mascot.png"
          cp static/images/case-autosfera-ai.png static/video/autosfera-ai-defense-poster.png
          curl --fail --location --retry 3             --output static/video/autosfera-ai-defense.mp4             "https://raw.githubusercontent.com/dimitry8st-prog/AutoSfera-AI-/demo/course-video-package/demo/video-defense/AutoSfera_AI_Defense_Stepanov_DA.mp4"
          test "$(wc -c < static/video/autosfera-ai-defense.mp4)" -eq 13001443
          rm -f static/images/case-autosfera-ai.svg
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/images/case-autosfera-ai.png                   static/video/autosfera-ai-defense-poster.png                   static/video/autosfera-ai-defense.mp4                   static/images/case-autosfera-ai.svg
          git commit -m "Добавить медиа AutoSfera AI"
          git push origin HEAD:codex/autosfera-mascot-video
