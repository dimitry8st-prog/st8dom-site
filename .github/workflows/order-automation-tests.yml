name: order-automation-tests

on:
  pull_request:
    paths:
      - "app.py"
      - "config.py"
      - "models.py"
      - "payments_robokassa.py"
      - "order_automation.py"
      - "n8n_orders_api.py"
      - "inquiry_autoreply.py"
      - "templates/products.html"
      - "templates/payment*.html"
      - "templates/admin/orders.html"
      - "tests/**"
      - "deploy/install-order-notifications.sh"
      - "workflows/**"
      - "scripts/test_nns09_workflow.js"
      - "requirements.txt"
      - ".github/workflows/order-automation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: bash -n deploy/install-order-notifications.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test_nns09_workflow.js
